<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campus Cart</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js?v=2" defer></script>
</head>
<body>
    <header class="top"><div class="wrap brand">Campus<span>Cart</span></div></header>
    <main class="wrap">
        <section class="intro">
            <h1>Campus essentials</h1>
            <p>Shop stationery, electronics, and everyday supplies.</p>
        </section>
        <div class="workspace">
            <section aria-labelledby="catalog-heading">
                <div class="section-head"><h2 id="catalog-heading">Products</h2><span id="product-count"></span></div>
                <form id="search-form" class="search">
                    <input name="q" aria-label="Search products" placeholder="Search products or categories">
                    <button class="secondary">Search</button>
                </form>
                <div id="products" class="products"></div>
            </section>
            <section class="cart panel" aria-labelledby="cart-heading">
                <div class="section-head"><h2 id="cart-heading">Your cart</h2><span id="cart-count"></span></div>
                <div id="cart-lines"></div>
                <div class="subtotal"><span>Subtotal</span><strong id="subtotal"></strong></div>
                <form id="checkout-form">
                    <label for="customer">Customer</label>
                    <select id="customer" name="customerId" required></select>
                    <label for="coupon">Discount code <small>Try CAMPUS10 for 10% off</small></label>
                    <input id="coupon" name="coupon" placeholder="Enter code">
                    <button id="place-order" class="checkout" disabled>Place order</button>
                </form>
                <div id="status" role="status" aria-live="polite"></div>
                <div id="receipt"></div>
            </section>
        </div>
        <section class="account panel" aria-labelledby="orders-heading">
            <h2 id="orders-heading">Order history</h2>
            <div id="orders"></div>
            <details>
                <summary>Register a customer</summary>
                <form id="registration">
                    <label>Name <input name="name" autocomplete="name" maxlength="100" required></label>
                    <label>Email <input type="email" name="email" autocomplete="email" maxlength="180" required></label>
                    <button class="secondary">Register</button>
                </form>
                <p id="registration-status" role="status"></p>
            </details>
        </section>
    </main>
</body>
</html>
